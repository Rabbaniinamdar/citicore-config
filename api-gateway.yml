# =============================================================================
# api-gateway.yml — API GATEWAY OVERRIDES
# Only the properties that genuinely differ from the shared configuration.
#
# Routes use lb:// (load-balanced) so they resolve through Eureka locally
# and Kubernetes DNS in staging/production. No hardcoded container names.
# =============================================================================

server:
  port: 8080
  address: 0.0.0.0
  shutdown: graceful

spring:
  application:
    name: apigateway-service

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:

        # =====================================================
        # AUTH SERVICE
        # =====================================================
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
            - Method=GET,POST
          filters:
            - RewritePath=/auth/(?<segment>.*), /api/v1/auth/${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 4
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # =====================================================
        # USER SERVICE
        # =====================================================
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
            - Method=GET,POST
          filters:
            - RewritePath=/users/(?<segment>.*), /api/v1/users/${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 4
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: userCircuitBreaker
                fallbackUri: forward:/fallback/users
            - name: Retry
              args:
                retries: 1
                methods: GET
                statuses:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
                  - INTERNAL_SERVER_ERROR
                exceptions:
                  - java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: true

        # =====================================================
        # ACCOUNT SERVICE
        # =====================================================
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/accounts/**
            - Method=GET,POST
          filters:
            - RewritePath=/accounts/(?<segment>.*), /api/v1/accounts/${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 4
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: accountCircuitBreaker
                fallbackUri: forward:/fallback/account
            - name: Retry
              args:
                retries: 1
                methods: GET
                statuses:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
                  - INTERNAL_SERVER_ERROR
                exceptions:
                  - java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: true

        # =====================================================
        # TRANSACTION SERVICE
        # =====================================================
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/transaction/**
            - Method=GET,POST
          filters:
            - RewritePath=/transaction/(?<segment>.*), /api/v1/transaction/${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 4
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: transactionCircuitBreaker
                fallbackUri: forward:/fallback/transaction
            - name: Retry
              args:
                retries: 1
                methods: GET
                statuses:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
                  - INTERNAL_SERVER_ERROR
                exceptions:
                  - java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: true

        # =====================================================
        # NOTIFICATION SERVICE
        # =====================================================
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
          filters:
            - RewritePath=/notifications/(?<segment>.*), /api/v1/notifications/${segment}

# Per-route circuit breaker timeouts
resilience4j:
  timelimiter:
    instances:
      authCircuitBreaker:
        timeout-duration: 3s
      userCircuitBreaker:
        timeout-duration: 3s
      accountCircuitBreaker:
        timeout-duration: 3s
      transactionCircuitBreaker:
        timeout-duration: 3s

logging:
  level:
    com.citicore.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.filter LoadBalancerClientFilter: DEBUG