# =============================================================================
# auth-service-local.yml — AUTH SERVICE LOCAL OVERRIDES
# Only the properties that differ from auth-service.yml for local dev.
# =============================================================================

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/citicore_authdb?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  # Schema initialization is safe locally; disabled for staging/prod.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  kafka:
    bootstrap-servers: kafka:9092

logging:
  level:
    com.citicore.auth: DEBUG
    org.springframework.security: DEBUG