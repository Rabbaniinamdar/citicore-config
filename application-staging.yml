# =============================================================================
# application-staging.yml — SHARED STAGING ENVIRONMENT OVERRIDES
#
# Activated by: SPRING_PROFILES_ACTIVE=staging
#
# AWS staging infrastructure:
#   - RDS MySQL (Multi-AZ)
#   - MSK Kafka (TLS + IAM auth)
#   - ElastiCache Redis (TLS)
#   - S3 (SSE-KMS)
#   - SES (Sandbox mode)
#   - Secrets Manager + IRSA for credentials
#
# NOTE: spring.config.import is intentionally NOT set here. It lives in each
# service's own application.yml to avoid a circular dependency.
# =============================================================================

# ─── Staging Database (RDS MySQL, TLS enforced) ────────────────────────────
spring:
  datasource:
    url: jdbc:mysql://${RDS_STAGING_ENDPOINT}:3306/${DB_NAME:citicore_staging}?serverTimezone=UTC&useSSL=true&requireSSL=true&verifyServerCertificate=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000

  # ─── Staging Kafka (MSK, SASL_SSL + AWS MSK IAM) ────────────────────────
  kafka:
    bootstrap-servers: ${MSK_STAGING_BOOTSTRAP_SERVERS}
    security:
      protocol: SASL_SSL
    properties:
      sasl:
        mechanism: AWS_MSK_IAM
      ssl:
        truststore-location: /etc/ssl/certs/java/cacerts
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed

  # ─── Staging Redis (ElastiCache, TLS enabled) ───────────────────────────
  data:
    redis:
      host: ${ELASTICACHE_STAGING_ENDPOINT}
      port: 6379
      ssl:
        enabled: true
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # ─── Staging Email (SES Sandbox) ────────────────────────────────────────
  mail:
    host: email-smtp.${AWS_REGION}.amazonaws.com
    port: 587
    username: ${SES_STAGING_USERNAME}
    password: ${SES_STAGING_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# ─── Staging Object Storage (S3, SSE-KMS) ──────────────────────────────────
aws:
  s3:
    region: ${AWS_REGION:us-east-1}
    bucket-prefix: citicore-staging

# ─── Staging Service Discovery (K8s DNS — Eureka disabled) ─────────────────
eureka:
  client:
    enabled: false
  server:
    wait-time-in-ms-when-sync-empty: 0

