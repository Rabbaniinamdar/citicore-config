# =============================================================================
# user-service-staging.yml — USER SERVICE STAGING OVERRIDES
# Only the properties that differ from user-service.yml for staging.
# =============================================================================

spring:
  datasource:
    url: jdbc:mysql://${RDS_STAGING_ENDPOINT}:3306/citicore_userdb?serverTimezone=UTC&useSSL=true&requireSSL=true&verifyServerCertificate=true
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  kafka:
    bootstrap-servers: ${MSK_STAGING_BOOTSTRAP_SERVERS}

aws:
  region: ${AWS_REGION}
  s3:
    bucket: citicore-staging-kyc-docs

kyc:
  upload-dir: /app/uploads/kyc/

logging:
  level:
    com.citicore.user: INFO