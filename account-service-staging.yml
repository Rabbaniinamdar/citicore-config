# =============================================================================
# account-service-staging.yml — ACCOUNT SERVICE STAGING OVERRIDES
# Only the properties that differ from account-service.yml for staging.
# =============================================================================

spring:
  datasource:
    primary:
      jdbc-url: jdbc:mysql://${RDS_STAGING_ENDPOINT}:3306/citicore_account?serverTimezone=UTC&useSSL=true&requireSSL=true&verifyServerCertificate=true
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
    replica:
      jdbc-url: jdbc:mysql://${RDS_REPLICA_STAGING_ENDPOINT:${RDS_STAGING_ENDPOINT}}:3306/citicore_account?serverTimezone=UTC&useSSL=true&requireSSL=true&verifyServerCertificate=true
      username: ${DB_REPLICA_USERNAME}
      password: ${DB_REPLICA_PASSWORD}
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5

  kafka:
    bootstrap-servers: ${MSK_STAGING_BOOTSTRAP_SERVERS}

  sql:
    init:
      mode: never

logging:
  level:
    com.citicore.account: INFO
    org.springframework.data.redis: WARN
    org.apache.kafka: WARN