# =============================================================================
# api-gateway-staging.yml — API GATEWAY STAGING OVERRIDES
# Only the properties that differ from api-gateway.yml for staging.
#
# Service discovery switches from Eureka to Kubernetes DNS.
# =============================================================================

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    enabled: false

logging:
  level:
    com.citicore.gateway: INFO
    org.springframework.cloud.gateway: INFO