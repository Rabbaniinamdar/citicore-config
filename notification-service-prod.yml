# =============================================================================
# notification-service-prod.yml — NOTIFICATION SERVICE PRODUCTION OVERRIDES
# Only the properties that differ from notification-service.yml for production.
# =============================================================================

spring:
  mail:
    host: email-smtp.${AWS_REGION}.amazonaws.com
    port: 587
    username: ${SES_PROD_USERNAME}
    password: ${SES_PROD_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  kafka:
    bootstrap-servers: ${MSK_PROD_BOOTSTRAP_SERVERS}

logging:
  level:
    com.citicore.notification: INFO
    org.springframework.mail: INFO