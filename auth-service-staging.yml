# =============================================================================
# auth-service-staging.yml — AUTH SERVICE STAGING OVERRIDES
# Only the properties that differ from auth-service.yml for staging.
# =============================================================================

spring:
  datasource:
    url: jdbc:mysql://${RDS_STAGING_ENDPOINT}:3306/citicore_authdb?serverTimezone=UTC&useSSL=true&requireSSL=true&verifyServerCertificate=true
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  kafka:
    bootstrap-servers: ${MSK_STAGING_BOOTSTRAP_SERVERS}

  sql:
    init:
      mode: never

logging:
  level:
    com.citicore.auth: INFO
    org.springframework.security: WARN