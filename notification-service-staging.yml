# =============================================================================
# notification-service-staging.yml — NOTIFICATION SERVICE STAGING OVERRIDES
# Only the properties that differ from notification-service.yml for staging.
# =============================================================================

spring:
  mail:
    host: email-smtp.${AWS_REGION}.amazonaws.com
    port: 587
    username: ${SES_STAGING_USERNAME}
    password: ${SES_STAGING_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  kafka:
    bootstrap-servers: ${MSK_STAGING_BOOTSTRAP_SERVERS}

logging:
  level:
    com.citicore.notification: INFO
    org.springframework.mail: INFO