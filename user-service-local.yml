# =============================================================================
# user-service-local.yml — USER SERVICE LOCAL OVERRIDES
# Only the properties that differ from user-service.yml for local dev.
# =============================================================================

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/citicore_userdb?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  kafka:
    bootstrap-servers: kafka:9092

aws:
  region: us-east-1
  s3:
    endpoint: http://minio:9000
    bucket: ${S3_BUCKET:citicore-kyc-docs}
    path-style-access: true
    credentials:
      access-key: ${MINIO_ROOT_USER:minioadmin}
      secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}

kyc:
  upload-dir: /app/uploads/kyc/

logging:
  level:
    com.citicore.user: DEBUG