# =============================================================================
# eureka-server-local.yml — EUREKA SERVER LOCAL OVERRIDES
# Only the properties that differ from eureka-server.yml for local dev.
# =============================================================================

server:
  port: 8761

eureka:
  server:
    wait-time-in-ms-when-sync-empty: 0
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    com.citicore.eureka: DEBUG
    com.netflix.eureka: DEBUG