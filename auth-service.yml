# =============================================================================
# auth-service.yml — AUTH SERVICE OVERRIDES
#
# Only the properties that genuinely differ from the shared configuration.
# Inherited from: application.yml
# =============================================================================

server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://${AUTH_DB_HOST}:3306/citicore_authdb?serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # auth-service only PRODUCES (otp-topic) — no consumer group needed.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      retries: 3

# auth-service specific business configuration
citicore:
  auth:
    otp:
      length: 6
      expiry-seconds: 180
    lockout:
      max-attempts: 5
      duration-minutes: 15

logging:
  level:
    com.citicore.auth: INFO
    org.springframework.security: WARN